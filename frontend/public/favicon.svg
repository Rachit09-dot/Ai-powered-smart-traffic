<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark Background Container -->
  <rect width="32" height="32" rx="7" fill="#0A0A0A" stroke="#333333" stroke-width="1.2" />

  <!-- Road / Highway Perspective Edges -->
  <path d="M 6.5 29 L 11.5 5" stroke="#404040" stroke-width="1.3" stroke-linecap="round" />
  <path d="M 25.5 29 L 20.5 5" stroke="#404040" stroke-width="1.3" stroke-linecap="round" />

  <!-- Dashed Center Lane Markings -->
  <line x1="16" y1="28" x2="16" y2="24" stroke="#737373" stroke-width="1.2" stroke-linecap="round" />
  <line x1="16" y1="21" x2="16" y2="18" stroke="#737373" stroke-width="1.2" stroke-linecap="round" />
  <line x1="16" y1="15" x2="16" y2="13" stroke="#737373" stroke-width="1.2" stroke-linecap="round" />

  <!-- Smart Traffic Sensor Arcs (AI Detection Wave) -->
  <path d="M 11.5 6 C 12.8 4.7 14.3 4 16 4 C 17.7 4 19.2 4.7 20.5 6" stroke="#D4D4D4" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />
  <path d="M 13.2 7.8 C 14 7 15 6.5 16 6.5 C 17 6.5 18 7 18.8 7.8" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

  <!-- Vehicle Silhouette (Modern Aerodynamic Car - Top/Front View) -->
  <!-- Outer Chassis -->
  <path d="M 12.2 12.5 C 12.2 10.2 13.5 9 16 9 C 18.5 9 19.8 10.2 19.8 12.5 L 20.2 19 C 20.2 21.2 19.2 22.2 16 22.2 C 12.8 22.2 11.8 21.2 11.8 19 Z" fill="#FFFFFF" />
  
  <!-- Windshield -->
  <path d="M 13.3 12.8 C 13.8 11.2 14.8 10.5 16 10.5 C 17.2 10.5 18.2 11.2 18.7 12.8 L 18.7 14.2 L 13.3 14.2 Z" fill="#0A0A0A" />

  <!-- Roof & Rear Window -->
  <rect x="13.8" y="15.8" width="4.4" height="2.8" rx="0.6" fill="#0A0A0A" />

  <!-- Side mirrors -->
  <rect x="11.2" y="13.5" width="0.8" height="1.8" rx="0.3" fill="#FFFFFF" />
  <rect x="20" y="13.5" width="0.8" height="1.8" rx="0.3" fill="#FFFFFF" />

  <!-- Front Headlight Accents -->
  <line x1="13.2" y1="9.8" x2="14.6" y2="10.2" stroke="#0A0A0A" stroke-width="0.8" stroke-linecap="round" />
  <line x1="18.8" y1="9.8" x2="17.4" y2="10.2" stroke="#0A0A0A" stroke-width="0.8" stroke-linecap="round" />
</svg>